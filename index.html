<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHM Node.js Server</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(90%, 600px);
      padding: 40px;
      text-align: center;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      color: #94a3b8;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #14532d;
      color: #86efac;
      font-weight: bold;
    }

    code {
      display: block;
      margin-top: 25px;
      padding: 14px;
      background: #020617;
      border-radius: 8px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>WHM Node.js Server</h1>

    <p>
      WebSocket and HTTP server is configured.
    </p>

    <div class="status">
      ● Online
    </div>

    <code>/sub</code>
  </div>

</body>
</html>
